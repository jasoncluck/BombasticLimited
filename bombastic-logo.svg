<svg
  viewBox="0 0 105 40"
  width="105"
  height="40"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <clipPath id="clip-bomb-part">
      <!-- x and width tuned so only "Bomb" is covered.
           Start x matches the text's x. -->
      <rect x="6" y="8" width="36" height="18" />
    </clipPath>
  </defs>

  <!-- Full word in purple -->
  <text
    id="brandWord"
    x="6"
    y="22"
    font-family="Inter Variable, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="16"
    font-weight="700"
    kerning="normal"
    letter-spacing="0"
    fill="#8b5cf6">Bombastic</text>

  <!-- Grey overlay clipped to first portion -->
  <text
    x="6"
    y="22"
    font-family="Inter Variable, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="16"
    font-weight="700"
    kerning="normal"
    letter-spacing="0"
    fill="#94a3b8"
    clip-path="url(#clip-bomb-part)">Bombastic</text>

  <text
    x="46"
    y="34"
    font-family="Inter Variable, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="9"
    font-weight="600"
    letter-spacing="1.5px"
    text-anchor="middle"
    fill="#94a3b8">LIMITED</text>
</svg>

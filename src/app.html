<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bombastic Limited</title>
    <!-- <link rel="icon" href="%sveltekit.assets%/favicon.png" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="absolute w-full h-full flex flex-col overscroll-y-none min-h-[600px] min-w-[350px] overflow-hidden"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
  <script>
    // In your app.html or main layout
    // Optional: Preload routes on hover/focus for even faster navigation
    if ("serviceWorker" in navigator) {
      // Preload routes when user hovers over links
      document.addEventListener("mouseover", (event) => {
        const link = event.target.closest("a[href]");
        if (link && link.href.startsWith(window.location.origin)) {
          navigator.serviceWorker.controller?.postMessage({
            type: "PRELOAD_ROUTE",
            data: { url: link.href },
          });
        }
      });

      // Listen for cache updates
      navigator.serviceWorker.addEventListener("message", (event) => {
        if (event.data?.type === "CACHE_CLEARED") {
          console.log("Cache cleared successfully");
        }
      });
    }
  </script>
</html>

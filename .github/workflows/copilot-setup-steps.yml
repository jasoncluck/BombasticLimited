name: Copilot Development Setup

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  setup-development-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        run: |
          npm install -g supabase
          supabase --version

      - name: Start Supabase local development server
        run: |
          # Initialize Supabase if not already done
          if [ ! -f "supabase/config.toml" ]; then
            supabase init
          fi

          # Start local Supabase services (PostgreSQL, Auth, etc.)
          supabase start

          # Wait for services to be ready
          sleep 10

          # Show status of running services
          supabase status

      - name: Ensure MCP Configuration exists
        run: |
          # Create .vscode directory if it doesn't exist
          mkdir -p .vscode

          # Check if MCP config already exists
          if [ ! -f ".vscode/mcp.json" ]; then
            echo "Creating MCP configuration file..."
            cat > .vscode/mcp.json << 'EOF'
          {
            "mcpServers": {
              "playwright": {
                "command": "npx",
                "args": ["-y", "@executeautomation/playwright-mcp-server"],
                "type": "local",
                "tools": []
              }
            }
          }
          EOF
            echo "✅ MCP configuration created at .vscode/mcp.json"
          else
            echo "✅ MCP configuration already exists"
          fi

      - name: Install Playwright browsers (for local testing)
        run: |
          npx playwright install
          npx playwright install-deps

      - name: Run basic health checks
        run: |
          # Check if Supabase is running
          curl -f http://localhost:54321/health || echo "Supabase health check failed"

          # Check if database is accessible
          supabase db ping || echo "Database ping failed"

      - name: Display setup information
        run: |
          echo "🚀 Development environment setup complete!"
          echo ""
          echo "📊 Supabase Services:"
          supabase status
          echo ""
          echo "🎭 Playwright MCP Server: Configured (will auto-install via npx)"
          echo "📝 MCP Configuration: Available at .vscode/mcp.json"
          echo ""
          echo "🔧 Next steps for local development:"
          echo "1. Restart VS Code to load MCP configuration"
          echo "2. Enable GitHub Copilot Agent mode"
          echo "3. Use '@playwright' in Copilot chat for browser automation"
          echo "4. Supabase local services are running on:"
          echo "   - API: http://localhost:54321"
          echo "   - DB: postgresql://postgres:postgres@localhost:54322/postgres"
          echo "   - Studio: http://localhost:54323"
          echo ""
          echo "🛑 To stop Supabase services later: supabase stop"

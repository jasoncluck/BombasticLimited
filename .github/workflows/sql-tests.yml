name: SQL Tests

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'supabase/**/*.sql'
      - 'src/tests/sql/**'
      - 'src/lib/test-utils/**'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'supabase/**/*.sql'
      - 'src/tests/sql/**'
      - 'src/lib/test-utils/**'

jobs:
  sql-tests:
    name: SQL Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: supabase/postgres:15.1.1.27
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 54322:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SQL syntax validation tests
        run: npm run test:sql:syntax

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        run: |
          # Configure database connection
          export PGUSER=postgres
          export PGPASSWORD=postgres
          export PGHOST=localhost
          export PGPORT=54322
          export PGDATABASE=postgres
          
          # Apply migrations manually since we're using a raw postgres instance
          for migration in supabase/migrations/*.sql; do
            echo "Applying migration: $migration"
            psql -f "$migration" || echo "Migration failed or already applied: $migration"
          done

      - name: Run SQL migration tests
        run: npm run test:sql:migration
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 54322
          TEST_DB_NAME: postgres
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres

      - name: Run SQL functional tests
        run: npm run test:sql:functional
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 54322
          TEST_DB_NAME: postgres
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres

      - name: Run SQL integration tests
        run: npm run test:sql:integration
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 54322
          TEST_DB_NAME: postgres
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-test-results
          path: |
            coverage/
            test-results/